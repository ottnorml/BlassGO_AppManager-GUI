# Build Workflow for Multi-Platform Desktop Application
#
# This workflow builds the Flutter desktop application for all major operating systems:
# - Linux (x64)
# - macOS (Universal binary - supports both Intel and Apple Silicon)
# - Windows (x64)
#
# The workflow is triggered on:
# - Manual dispatch (workflow_dispatch)
# - Push to main branch
# - Pull requests to main branch
#
# Each platform build creates optimized release binaries and uploads them as artifacts
# that can be downloaded or used in release workflows.

name: Build Multi-Platform

# Workflow triggers
on:
  # Allow manual workflow triggering from GitHub UI
  workflow_dispatch:
  
  # Trigger on push to main branch
  push:
    branches: [ "main" ]
  
  # Trigger on pull requests targeting main branch
  pull_request:
    branches: [ "main" ]

# Define permissions for the workflow
permissions:
  contents: read

jobs:
  # Job 1: Build for Linux
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Install Linux build dependencies
      # These are required for building Flutter desktop apps on Linux
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev
      
      # Step 3: Set up Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      # Step 4: Enable Linux desktop support
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      
      # Step 5: Install dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # Step 6: Build Linux release
      - name: Build Linux app
        run: flutter build linux --release
      
      # Step 7: Package the Linux build
      # Create a tar.gz archive of the build output
      - name: Package Linux build
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../app_manager_linux_x64.tar.gz .
      
      # Step 8: Upload Linux build artifact
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: app_manager_linux_x64.tar.gz
          retention-days: 7
  
  # Job 2: Build for macOS
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    
    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Set up Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      # Step 3: Enable macOS desktop support
      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop
      
      # Step 4: Install dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # Step 5: Build macOS release
      # Note: This creates a universal binary that works on both Intel and Apple Silicon Macs
      - name: Build macOS app
        run: flutter build macos --release
      
      # Step 6: Package the macOS build
      # Create a DMG or zip archive of the .app bundle
      - name: Package macOS build
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../app_manager_macos.zip app_manager.app
      
      # Step 7: Upload macOS build artifact
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: app_manager_macos.zip
          retention-days: 7
  
  # Job 3: Build for Windows
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    
    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Set up Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      # Step 3: Enable Windows desktop support
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      
      # Step 4: Install dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # Step 5: Build Windows release
      - name: Build Windows app
        run: flutter build windows --release
      
      # Step 6: Package the Windows build
      # Create a zip archive of the build output
      - name: Package Windows build
        run: |
          cd build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath ..\..\..\..\..\app_manager_windows_x64.zip
        shell: pwsh
      
      # Step 7: Upload Windows build artifact
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: app_manager_windows_x64.zip
          retention-days: 7
